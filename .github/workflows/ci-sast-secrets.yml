name: SAST & Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output EVIDENCE/P10/semgrep.sarif \
            || true

      - name: Run Gitleaks secrets scan
        run: |
          docker run -v $(pwd):/src zricethezav/gitleaks:latest detect \
            --source="/src" \
            --report-path="EVIDENCE/P10/gitleaks.json" \
            --config-path="security/.gitleaks.toml" \
            --no-git || true

      - name: Create summary
        run: |
          echo "SAST & Secrets scan completed" > EVIDENCE/P10/sast_summary.md
          echo "Reports saved in EVIDENCE/P10/" >> EVIDENCE/P10/sast_summary.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets
          path: EVIDENCE/P10/