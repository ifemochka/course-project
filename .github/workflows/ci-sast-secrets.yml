name: SAST & Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Semgrep SAST
        run: |
          docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output EVIDENCE/P10/semgrep.sarif \
            || true  # Не падать при нахождении проблем

      - name: Run custom Semgrep rules
        run: |
          if [ -f security/semgrep/rules.yml ]; then
            docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
              --config security/semgrep/rules.yml \
              --sarif \
              --output EVIDENCE/P10/semgrep-custom.sarif \
              || true
          fi

      - name: Run Gitleaks secrets scan
        run: |
          docker run -v $(pwd):/src zricethezav/gitleaks:latest detect \
            --source="/src" \
            --report-path="EVIDENCE/P10/gitleaks.json" \
            --config-path="security/.gitleaks.toml" \
            --verbose \
            --no-git || true

      - name: Create summary report
        run: |
          mkdir -p EVIDENCE/P10
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "Generated: $(date)" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          echo "## Semgrep Findings" >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            echo "- SAST scan completed" >> EVIDENCE/P10/sast_summary.md
            echo "- Report: semgrep.sarif" >> EVIDENCE/P10/sast_summary.md
          else
            echo "- No SAST report generated" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Gitleaks Findings" >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            echo "- Secrets scan completed" >> EVIDENCE/P10/sast_summary.md
            echo "- Report: gitleaks.json" >> EVIDENCE/P10/sast_summary.md
          else
            echo "- No secrets report generated" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
          echo "1. Review semgrep.sarif for code vulnerabilities" >> EVIDENCE/P10/sast_summary.md
          echo "2. Check gitleaks.json for exposed secrets" >> EVIDENCE/P10/sast_summary.md
          echo "3. Fix critical issues or add to backlog" >> EVIDENCE/P10/sast_summary.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets
          path: EVIDENCE/P10/