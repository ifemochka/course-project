name: SAST & Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output EVIDENCE/P10/semgrep.sarif \
            || true

      - name: Run Semgrep custom rules
        run: |
          if [ -f security/semgrep/rules.yml ]; then
            docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
              --config security/semgrep/rules.yml \
              --sarif \
              --output EVIDENCE/P10/semgrep-custom.sarif \
              || true
          fi

      - name: Run Gitleaks secrets scan
        run: |
          docker run -v $(pwd):/src zricethezav/gitleaks:latest detect \
            --source="/src" \
            --report-path="EVIDENCE/P10/gitleaks.json" \
            --config-path="security/.gitleaks.toml" \
            --no-git || true

      - name: Create summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "Generated: $(date)" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Files Created" >> EVIDENCE/P10/sast_summary.md
          echo "- semgrep.sarif: Standard SAST report" >> EVIDENCE/P10/sast_summary.md
          echo "- semgrep-custom.sarif: Custom rules SAST report" >> EVIDENCE/P10/sast_summary.md
          echo "- gitleaks.json: Secrets detection report" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Integration" >> EVIDENCE/P10/sast_summary.md
          echo "This workflow complements P08 (CI) and P09 (SBOM/SCA) for complete DevSecOps pipeline." >> EVIDENCE/P10/sast_summary.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets
          path: EVIDENCE/P10/