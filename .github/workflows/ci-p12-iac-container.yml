name: IaC & Container Security (P12)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci-p12-iac-container.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P12

      - name: Build Docker image
        run: |
          docker build -t suggestion-box:latest .

      - name: Run Hadolint on Dockerfile
        run: |
          docker run --rm -v $PWD:/work hadolint/hadolint \
            hadolint -f json /work/Dockerfile > EVIDENCE/P12/hadolint_report.json || true

      - name: Run Checkov IaC scan
        run: |
          docker run --rm -v $PWD:/work bridgecrew/checkov \
            -d /work \
            -o json \
            --skip-check CKV_DOCKER_3 \
            --skip-check CKV_DOCKER_7 > EVIDENCE/P12/checkov_report.json || true

      - name: Run Trivy image scan
        run: |
          docker run --rm -v $PWD:/work aquasec/trivy:latest \
            image suggestion-box:latest \
            --format json \
            --output /work/EVIDENCE/P12/trivy_report.json || true

      - name: Create hardening summary
        run: |
          echo "# Container & IaC Hardening Summary" > EVIDENCE/P12/hardening_summary.md
          echo "Generated: $(date)" >> EVIDENCE/P12/hardening_summary.md
          echo "" >> EVIDENCE/P12/hardening_summary.md
          echo "## Applied Hardening Measures" >> EVIDENCE/P12/hardening_summary.md
          echo "- Non-root user in Dockerfile" >> EVIDENCE/P12/hardening_summary.md
          echo "- Healthcheck configuration" >> EVIDENCE/P12/hardening_summary.md
          echo "- Multi-stage build to reduce size" >> EVIDENCE/P12/hardening_summary.md
          echo "- No latest tags for base images" >> EVIDENCE/P12/hardening_summary.md
          echo "" >> EVIDENCE/P12/hardening_summary.md
          echo "## Scan Reports" >> EVIDENCE/P12/hardening_summary.md
          echo "- Hadolint: Dockerfile linting" >> EVIDENCE/P12/hardening_summary.md
          echo "- Checkov: IaC security checks" >> EVIDENCE/P12/hardening_summary.md
          echo "- Trivy: Container vulnerability scan" >> EVIDENCE/P12/hardening_summary.md

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p12-security-evidence
          path: EVIDENCE/P12/