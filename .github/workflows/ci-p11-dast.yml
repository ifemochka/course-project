name: DAST Scan (P11)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence dir
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn

      - name: Start app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          sleep 5
          curl -f http://localhost:8080/health || true

      - name: Run ZAP baseline scan
        run: |
          docker run --rm --network host -v $PWD:/zap/wrk owasp/zap2docker-stable \
            zap-baseline.py \
              -t http://localhost:8080 \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d || true
          mv zap_baseline.* EVIDENCE/P11/ 2>/dev/null || true

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p11-dast-evidence
          path: EVIDENCE/P11/